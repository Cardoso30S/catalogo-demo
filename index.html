<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catálogo digital · demonstração</title>
<meta name="description" content="Demonstração de catálogo digital para distribuidoras e chaveiros: catálogo online, PDF e pedidos pelo WhatsApp. Dados fictícios.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0F3D3E">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="preload" href="fonts/barlow-condensed-800.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/barlow-condensed-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/barlow-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="bar">
  <div class="bar-in">
    <div class="brand">
      <img class="logo" src="img/logo-h.png" alt="">
      <span class="pill-prev" id="pill-prev" hidden>Prévia</span>
    </div>
    <nav class="seg" id="seg" role="tablist" aria-label="Catálogos"></nav>
    <div class="busca" id="busca" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input type="search" id="f-q" placeholder="Buscar código, carro ou marca" aria-label="Buscar produto" autocomplete="off" enterkeyhint="search">
    </div>
    <div class="actions">
      <button class="btn ghost" id="b-lista" type="button" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Produtos</button>
      <button class="btn ghost" id="b-precos" type="button" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>Preços</button>
      <button class="btn light" id="b-novo" type="button" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Adicionar produto</button>
      <button class="btn light" id="b-pedido" type="button" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h3l2.6 12.2a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.5L22 7H6.2"/></svg>Pedido<span class="cnt" id="n-pedido" hidden>0</span></button>
      <button class="btn accent" id="b-pdf" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>Baixar PDF</button>
    </div>
    <button class="btn ghost logout" id="b-logout" type="button" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H3"/></svg>Sair</button>
  </div>
</header>

<div class="hint" id="hint">
  <div class="hint-in">
    <span class="dot"></span>
    <p id="hint-t"></p>
    <button class="x" id="hint-x" type="button" aria-label="Fechar aviso">×</button>
  </div>
</div>

<main class="viewer" id="viewer" aria-label="Páginas do catálogo"><div class="loading">Carregando catálogo…</div></main>

<footer class="site-foot">
  <div class="sf-in">
    <span id="sf-txt"></span>
    <button class="sf-link" id="b-login" type="button" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Entrar</button>
    <button class="sf-link" id="b-logout-foot" type="button" hidden>Sair do modo de edição</button>
  </div>
</footer>

<div class="mbar">
  <button class="btn ghost" id="m-lista" type="button" hidden>Produtos</button>
  <button class="btn light" id="m-novo" type="button" hidden>+ Adicionar</button>
  <button class="btn light" id="m-pedido" type="button" hidden>Pedido<span class="cnt" id="nm-pedido" hidden>0</span></button>
  <button class="btn accent" id="m-pdf" type="button">Baixar PDF</button>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-labelledby="dr-title" role="dialog">
  <div class="dr-head">
    <div><h2 id="dr-title"></h2><div class="sub" id="dr-sub"></div></div>
    <button class="close" id="dr-close" type="button" aria-label="Fechar">×</button>
  </div>
  <div class="dr-body" id="dr-body"></div>
  <div class="dr-foot" id="dr-foot"></div>
</aside>
<div class="toast" id="toast" hidden role="status"></div>
<div class="busy" id="busy" hidden><div class="busy-in"><b id="busy-h">Gerando PDF</b><span id="busy-t">Preparando páginas…</span><div class="busy-bar"><i id="busy-bar"></i></div></div></div>
<div id="stage-wrap" aria-hidden="true"><div id="stage" hidden></div></div>

<script src="js/config.js"></script>
<script src="js/lib/qrcode.js"></script>
<script src="js/app.js"></script>
</body>
</html>
